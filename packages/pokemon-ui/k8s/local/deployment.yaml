apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-ui
  labels:
    app: pokemon-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokemon-ui
  template:
    metadata:
      labels:
        app: pokemon-ui
    spec:
      containers:
        - name: pokemon-ui
          image: pokemon-ui
          ports:
            - containerPort: 4200
---
apiVersion: v1
kind: Service
metadata:
  name: pokemon-ui-service
spec:
  selector:
    app: pokemon-ui
  ports:
    - protocol: TCP
      port: 4200
      targetPort: 4200
  type: LoadBalancer
